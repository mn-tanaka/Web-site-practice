<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="オーディション番組が映るリビングのテレビのイラスト">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3560"/>
      <stop offset="70%" stop-color="#5B4570"/>
      <stop offset="100%" stop-color="#8A5A72"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0C4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFF0C4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="176" y="128" width="448" height="252" rx="10"/>
    </clipPath>
  </defs>

  <!-- room -->
  <rect width="800" height="600" fill="#F3E7D8"/>
  <rect y="430" width="800" height="170" fill="#E2CDB4"/>
  <rect y="430" width="800" height="10" fill="#D3BB9E"/>
  <circle cx="400" cy="250" r="230" fill="#F8EFE3" opacity="0.7"/>

  <!-- tv body -->
  <rect x="160" y="112" width="480" height="284" rx="18" fill="#40404E"/>
  <rect x="170" y="122" width="460" height="264" rx="14" fill="#2C2C38"/>

  <!-- screen -->
  <g clip-path="url(#screenClip)">
    <rect x="176" y="128" width="448" height="252" fill="url(#stage)"/>
    <!-- spotlights -->
    <path d="M262 128 L200 344 L330 344 Z" fill="url(#beam)"/>
    <path d="M400 128 L336 352 L464 352 Z" fill="url(#beam)"/>
    <path d="M538 128 L470 344 L600 344 Z" fill="url(#beam)"/>
    <!-- audience glow sticks -->
    <g fill="#FFE6A3" opacity="0.85">
      <circle cx="212" cy="316" r="4"/><circle cx="248" cy="330" r="3"/><circle cx="292" cy="320" r="4"/>
      <circle cx="512" cy="322" r="4"/><circle cx="556" cy="332" r="3"/><circle cx="596" cy="316" r="4"/>
    </g>
    <!-- stage floor -->
    <ellipse cx="400" cy="366" rx="200" ry="46" fill="#B87E93" opacity="0.55"/>
    <!-- performers -->
    <g fill="#241F3A">
      <g transform="translate(322 224)">
        <circle cx="0" cy="0" r="17"/>
        <path d="M-20 22 q20 -12 40 0 l8 74 h-56 z"/>
        <path d="M-20 30 l-22 40" stroke="#241F3A" stroke-width="10" stroke-linecap="round"/>
        <path d="M20 30 l24 -30" stroke="#241F3A" stroke-width="10" stroke-linecap="round"/>
      </g>
      <g transform="translate(400 206)">
        <circle cx="0" cy="0" r="19"/>
        <path d="M-22 24 q22 -14 44 0 l10 88 h-64 z"/>
        <path d="M-22 34 l-30 -26" stroke="#241F3A" stroke-width="11" stroke-linecap="round"/>
        <path d="M22 34 l30 -26" stroke="#241F3A" stroke-width="11" stroke-linecap="round"/>
      </g>
      <g transform="translate(478 224)">
        <circle cx="0" cy="0" r="17"/>
        <path d="M-20 22 q20 -12 40 0 l8 74 h-56 z"/>
        <path d="M20 30 l22 40" stroke="#241F3A" stroke-width="10" stroke-linecap="round"/>
        <path d="M-20 30 l-24 -30" stroke="#241F3A" stroke-width="10" stroke-linecap="round"/>
      </g>
    </g>
    <!-- on-screen graphics -->
    <rect x="196" y="146" width="86" height="26" rx="13" fill="#C4697D"/>
    <circle cx="214" cy="159" r="6" fill="#FFF6EC"/>
    <rect x="226" y="153" width="42" height="12" rx="6" fill="#FFF6EC" opacity="0.9"/>
    <rect x="286" y="342" width="228" height="24" rx="12" fill="#FFF6EC" opacity="0.9"/>
    <rect x="298" y="350" width="126" height="8" rx="4" fill="#8A5A72"/>
    <g fill="#F2A0B4">
      <path d="M566 200 q10 -16 20 0 q10 16 -20 32 q-30 -16 -20 -32 q10 -16 20 0 z"/>
      <path d="M594 244 q7 -11 14 0 q7 11 -14 22 q-21 -11 -14 -22 q7 -11 14 0 z" opacity="0.8"/>
    </g>
  </g>

  <!-- tv stand -->
  <rect x="352" y="396" width="96" height="18" rx="8" fill="#3A3A46"/>
  <rect x="196" y="414" width="408" height="66" rx="12" fill="#C89A70"/>
  <rect x="196" y="414" width="408" height="12" rx="6" fill="#D8AF88"/>
  <rect x="228" y="440" width="150" height="26" rx="8" fill="#B4855E"/>
  <rect x="422" y="440" width="150" height="26" rx="8" fill="#B4855E"/>
  <rect x="212" y="480" width="18" height="26" rx="6" fill="#A87B57"/>
  <rect x="570" y="480" width="18" height="26" rx="6" fill="#A87B57"/>

  <!-- remote on the floor -->
  <g transform="translate(636 508) rotate(-10)">
    <rect x="0" y="0" width="34" height="76" rx="14" fill="#4C4C58"/>
    <circle cx="17" cy="18" r="7" fill="#C4697D"/>
    <rect x="8" y="34" width="18" height="6" rx="3" fill="#E7DED2"/>
    <rect x="8" y="46" width="18" height="6" rx="3" fill="#E7DED2"/>
  </g>

  <!-- plant -->
  <g transform="translate(96 372)">
    <path d="M34 40 q-34 -44 -6 -80 q22 32 6 80 z" fill="#8FA57C"/>
    <path d="M40 42 q34 -34 74 -30 q-28 30 -74 30 z" fill="#A3B78F"/>
    <path d="M32 44 q-40 -8 -56 18 q42 12 56 -18 z" fill="#7E946B"/>
    <path d="M6 40 h64 l-10 68 a12 12 0 0 1 -12 10 h-20 a12 12 0 0 1 -12 -10 z" fill="#DCA98A"/>
    <rect x="0" y="30" width="76" height="16" rx="8" fill="#E7BF9F"/>
  </g>

  <!-- sofa corner -->
  <g transform="translate(676 400)">
    <rect x="0" y="40" width="150" height="86" rx="22" fill="#C4697D"/>
    <rect x="-14" y="0" width="66" height="120" rx="24" fill="#D5809A"/>
    <rect x="18" y="26" width="112" height="48" rx="18" fill="#DE93A8"/>
  </g>
</svg>
