<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="イーゼルに立てかけたキャンバスとパレット、絵筆のイラスト">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#E5D2BC" opacity="0.7"/>
      <circle cx="13" cy="12" r="1" fill="#E5D2BC" opacity="0.5"/>
    </pattern>
    <clipPath id="canvasClip">
      <rect x="258" y="132" width="284" height="228" rx="6"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="#F4E7D6"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <circle cx="400" cy="270" r="228" fill="#FBF3E8" opacity="0.85"/>

  <!-- easel legs -->
  <g stroke="#C2A183" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M300 120 L232 512"/>
    <path d="M500 120 L568 512"/>
    <path d="M400 200 L400 540"/>
  </g>
  <rect x="222" y="372" width="356" height="16" rx="8" fill="#B08D6E"/>

  <!-- canvas -->
  <rect x="248" y="122" width="304" height="248" rx="10" fill="#FFFCF6" stroke="#DCC3A6" stroke-width="4"/>
  <g clip-path="url(#canvasClip)">
    <rect x="258" y="132" width="284" height="228" fill="#FDF7EE"/>
    <circle cx="470" cy="196" r="34" fill="#EBB9A0"/>
    <path d="M258 300 Q330 224 402 288 Q470 348 542 296 L542 360 L258 360 Z" fill="#BFCDB2"/>
    <path d="M258 330 Q346 286 430 330 Q500 366 542 340 L542 360 L258 360 Z" fill="#A7B994"/>
    <path d="M284 234 Q320 292 358 232" stroke="#C4697D" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="318" cy="180" r="9" fill="#C4697D" opacity="0.8"/>
    <circle cx="348" cy="164" r="5" fill="#D9A24E" opacity="0.9"/>
  </g>

  <!-- palette -->
  <g transform="translate(120 386) rotate(-8)">
    <path d="M0 60 C0 20 46 -12 100 -12 C154 -12 196 16 196 54 C196 84 168 96 146 96 C128 96 122 108 130 122 C138 138 122 152 96 152 C40 152 0 112 0 60 Z" fill="#E9CFB0" stroke="#CDAE8B" stroke-width="4"/>
    <circle cx="140" cy="106" r="17" fill="#FBF3E8"/>
    <circle cx="46" cy="52" r="14" fill="#C4697D"/>
    <circle cx="88" cy="30" r="13" fill="#D9A24E"/>
    <circle cx="132" cy="38" r="12" fill="#8FA57C"/>
    <circle cx="160" cy="70" r="11" fill="#7C93B5"/>
    <circle cx="52" cy="100" r="12" fill="#F0E3D2"/>
  </g>

  <!-- brush jar -->
  <g transform="translate(556 300)">
    <path d="M52 -96 L46 34" stroke="#C9A87F" stroke-width="9" stroke-linecap="round"/>
    <path d="M52 -96 l-9 -26 l18 0 z" fill="#C4697D"/>
    <path d="M92 -78 L74 34" stroke="#B08D6E" stroke-width="9" stroke-linecap="round"/>
    <path d="M92 -78 l-4 -27 l17 5 z" fill="#8FA57C"/>
    <path d="M16 -70 L30 34" stroke="#D9BE99" stroke-width="9" stroke-linecap="round"/>
    <path d="M16 -70 l-13 -23 l17 -3 z" fill="#D9A24E"/>
    <path d="M8 20 h100 a10 10 0 0 1 10 10 v58 a26 26 0 0 1 -26 26 h-68 a26 26 0 0 1 -26 -26 v-58 a10 10 0 0 1 10 -10 z" fill="#EFE0CB" stroke="#CDAE8B" stroke-width="4"/>
    <rect x="-4" y="14" width="128" height="16" rx="8" fill="#E3D0B6"/>
  </g>
</svg>
